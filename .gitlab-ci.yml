image: eclipse-temurin:8-jdk

stages:
  - test

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  CI_LOCAL_MAVEN_REPOSITORY: "file://$CI_PROJECT_DIR/build/ci-maven-repository"

cache:
  key: gradle-wrapper-jdk8
  paths:
    - .gradle/caches/
    - .gradle/wrapper/

test:
  stage: test
  script:
    - ./gradlew --version
    # PR-0B will defer publication repository validation; ordinary CI uses local placeholders and no release credentials.
    - ./gradlew clean test --console=plain -PsnapshotsRepository="$CI_LOCAL_MAVEN_REPOSITORY" -PreleasesRepository="$CI_LOCAL_MAVEN_REPOSITORY"
  artifacts:
    when: always
    reports:
      junit:
        - build/test-results/test/TEST-*.xml
    paths:
      - build/reports/tests/test/
      - build/test-results/test/
    expire_in: 1 week
  tags:
    - jdk8
