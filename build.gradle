buildscript {
    repositories {
        mavenLocal()
        maven { url 'https://maven.aliyun.com/repository/public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.researchgate:gradle-release:2.6.0'
    }
}

apply plugin: 'java'
apply plugin: 'maven-publish'
apply plugin: 'signing'
apply plugin: 'net.researchgate.release'

File signing_cfg = file(findProperty('signingPropertiesFile') ?: "$project.rootDir/signing.properties")

release {
    failOnUnversionedFiles = true
    failOnCommitNeeded = true
    failOnPublishNeeded = true
    failOnSnapshotDependencies = false
    failOnUpdateNeeded = true
    revertOnFail = true
    tagTemplate = 'v${version}'
    scmAdapters = [
            net.researchgate.release.GitAdapter
    ]

    git {
        requireBranch = 'master|v3.6.x|v3.7x'
        pushToRemote = 'origin'
        pushToBranchPrefix = ''
        commitVersionFileOnly = false
        signTag = false
    }

}

repositories {
    mavenLocal()
    maven { url 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
}

dependencies {
    implementation 'joda-time:joda-time:2.10.1'
    implementation 'org.jgroups:jgroups:3.6.20.Final'
    implementation "org.slf4j:slf4j-api:${slf4j_version}"
    implementation 'commons-logging:commons-logging:1.2'
    implementation 'org.jboss.logging:jboss-logging:3.1.4.GA'
    implementation 'commons-pool:commons-pool:1.6'
    implementation 'com.sleepycat:je:6.0.11'
    implementation 'org.tmatesoft.sqljet:sqljet:1.1.10'
    implementation 'commons-codec:commons-codec:1.9'
    implementation 'net.xdob.h2db:h2db:2.3.1'
    testImplementation 'junit:junit:4.11'
    testImplementation 'org.mockito:mockito-core:1.10.8'
    testImplementation 'org.hsqldb:hsqldb:2.3.2'
    testImplementation 'org.apache.derby:derby:10.11.1.1'
}

group = 'net.xdob.ha-jdbc2'
description = 'HA-JDBC2'



sourceCompatibility = project.jdkVersion
targetCompatibility = project.jdkVersion



configurations.all {
    resolutionStrategy {
        // cache dynamic versions for 10 seconds
        cacheDynamicVersionsFor 10, 'seconds'
        // don't cache changing modules at all
        cacheChangingModulesFor 0, 'seconds'
    }
}

import java.time.Duration
import java.io.DataInputStream
import java.util.jar.JarFile

import org.apache.tools.ant.filters.ReplaceTokens
import org.gradle.api.publish.maven.tasks.PublishToMavenRepository
import org.gradle.plugins.signing.Sign

def capabilityVersion = '1'
def buildHash = (findProperty('buildHash') ?: 'unknown').toString().trim()
if (buildHash.isEmpty()) {
    buildHash = 'unknown'
}
def requireKnownBuildHash = (findProperty('requireKnownBuildHash') ?: 'false').toString().toBoolean()
def buildMetadata = [
        capabilityVersion     : capabilityVersion,
        version               : project.version.toString(),
        buildHash             : buildHash,
        supportedFeatures     : '',
        candidateAliasProfiles: ''
]

processResources {
    inputs.properties(buildMetadata)
    from('src/main/java') {
        include '**/*.properties'
    }
    filter(ReplaceTokens, tokens: buildMetadata)
}

jar {
    inputs.properties(buildMetadata)
    manifest {
        attributes(
                'Implementation-Version': buildMetadata.version,
                'HA-JDBC-Capability-Version': buildMetadata.capabilityVersion,
                'HA-JDBC-Build-Hash': buildMetadata.buildHash,
                'HA-JDBC-Features': buildMetadata.supportedFeatures,
                'HA-JDBC-Candidate-Alias-Profiles': buildMetadata.candidateAliasProfiles
        )
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Test) {
    enabled = !(project.hasProperty('skipTests') && project.property('skipTests').toString().toBoolean())
    timeout = Duration.ofSeconds((project.findProperty('testTimeoutSeconds') ?: '120').toString().toLong())

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }

    afterSuite { desc, result ->
        if (!desc.parent) {
            logger.lifecycle("Test result: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)")
        }
    }
}

task verifyTestCompilation(type: JavaCompile) {
    group = 'verification'
    description = 'Compiles test sources without running tests; useful for quick feedback before running the full test gate.'
    source = sourceSets.test.java
    classpath = sourceSets.test.compileClasspath
    destinationDir = file("$buildDir/classes/java/verifyTestCompilation")
    sourceCompatibility = project.jdkVersion
    targetCompatibility = project.jdkVersion
    options.encoding = 'UTF-8'
}

//对于典型的 Java 项目，您可以添加一个javadocJar以及一个 sourcesJar任务
task javadocJar(type: Jar) {
    classifier = 'javadoc'
    from javadoc
}

task sourceJar(type: Jar) {
    classifier = 'sources'
    from sourceSets.main.allSource
}
// javadoc 配置，这里是自定义了 java doc 的一些配置
javadoc {
    description = "Generates project-level javadoc for use in -javadoc jar"

    options.memberLevel = org.gradle.external.javadoc.JavadocMemberLevel.PROTECTED
    options.author = true
    options.version = true
    options.header = project.name
    options.addStringOption('Xdoclint:none', '-quiet')

    // suppress warnings due to cross-module @see and @link references;
    // note that global 'api' task does display all warnings.
    logging.captureStandardError LogLevel.INFO
    logging.captureStandardOutput LogLevel.INFO // suppress "## warnings" message
    options.encoding = "UTF-8"  //编码一定要配置否则直接出错
    options.charSet = 'UTF-8'
}

// 并将它们与项目 jar 本身一起连接到 artifacts 集合中：
artifacts {
    archives javadocJar, sourceJar
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = project.name
            version = project.version
            //如果不定义，则会按照以上默认值执行
            // 指定要发布的模块
            from components.java
            // 添加源码jar
            artifact sourceJar
            // 添加javadocjar
            artifact javadocJar
            pom {
                name = 'ha-jdbc2'
                description = "High-Availability JDBC"
                // 构件主页
                url = 'https://github.com/dibyang/ha-jdbc2'
                // 许可证名称和地址
                licenses {
                    license {
                        name = 'GNU Lesser General Public License, Version 3.0'
                        url = 'https://www.gnu.org/licenses/lgpl-3.0.txt'
                    }
                }
                // 开发者信息
                developers {
                    developer {
                        id = 'dib.yang'
                        name = 'dib.yang'
                        email = 'dib.yang@gmail.com'
                    }
                }
                // 版本控制仓库地址
                scm {
                    url = 'https://github.com/dibyang/ha-jdbc2'
                    connection = 'scm:git:https://github.com/dibyang/ha-jdbc2.git'
                    developerConnection = 'scm:git:https://github.com/dibyang/ha-jdbc2.git'
                }
            }
        }
    }
    repositories {
        maven {
            // 远端地址和凭据只在真正执行远端发布任务时读取并校验。
            credentials {
            }
        }
    }
}

signing {
    required { !version.endsWith("SNAPSHOT") }
    sign configurations.archives
    sign publishing.publications.maven
}

def requireProjectProperty = { String propertyName ->
    def value = project.findProperty(propertyName)
    if (value == null || value.toString().trim().isEmpty()) {
        throw new GradleException("Task requires Gradle property '${propertyName}'.")
    }
    return value.toString().trim()
}

def validateKnownBuildHash = {
    if (!(buildMetadata.buildHash ==~ /(?i)[0-9a-f]{40}/)) {
        throw new GradleException('Task requires buildHash to be a 40-character hexadecimal Git commit hash.')
    }
}

def loadAndValidateSigningProperties = {
    if (!signing_cfg.isFile()) {
        throw new GradleException("Release publishing requires ${signing_cfg.name}.")
    }

    Properties signingProperties = new Properties()
    signing_cfg.withInputStream { input ->
        signingProperties.load(input)
    }
    signingProperties.each { propertyName, propertyValue ->
        project.ext.set(propertyName.toString(), propertyValue)
    }

    ['signing.keyId', 'signing.password', 'signing.secretKeyRingFile'].each { propertyName ->
        requireProjectProperty(propertyName)
    }
    File secretKeyRing = file(requireProjectProperty('signing.secretKeyRingFile'))
    if (!secretKeyRing.isFile()) {
        throw new GradleException("Signing secret key ring does not exist: ${secretKeyRing}")
    }
    if (signing.signatory == null) {
        throw new GradleException('Release publishing requires a valid signing signatory.')
    }
}

def releaseTask = tasks.getByName('release')

gradle.taskGraph.whenReady { taskGraph ->
    def remotePublishTasks = taskGraph.allTasks.findAll { task ->
        task instanceof PublishToMavenRepository
    }
    boolean releaseRequested = taskGraph.allTasks.contains(releaseTask)
    boolean localPublishRequested = taskGraph.allTasks.any { task ->
        task.name == 'publishToMavenLocal'
    }
    boolean requiredSignRequested = taskGraph.allTasks.any { task ->
        task instanceof Sign && task.required
    }
    boolean nonSnapshotBuild = !project.version.toString().endsWith('SNAPSHOT')

    if (releaseRequested || requiredSignRequested || (nonSnapshotBuild && localPublishRequested)) {
        validateKnownBuildHash()
        loadAndValidateSigningProperties()
    }

    if (!remotePublishTasks.isEmpty() || releaseRequested) {
        validateKnownBuildHash()
        boolean releasePublication = releaseRequested || nonSnapshotBuild
        String repositoryProperty = releasePublication ? 'releasesRepository' : 'snapshotsRepository'
        String repositoryUrl = requireProjectProperty(repositoryProperty)
        String repositoryUsername = requireProjectProperty('ossrhUsername')
        String repositoryPassword = requireProjectProperty('ossrhPassword')

        remotePublishTasks.each { publishTask ->
            publishTask.repository.url = uri(repositoryUrl)
            publishTask.repository.credentials.username = repositoryUsername
            publishTask.repository.credentials.password = repositoryPassword
        }
    }
}

task verifyBuildMetadata {
    group = 'verification'
    description = 'Verifies build identity consistency across the JAR, publication metadata and Java bytecode.'
    dependsOn jar, generatePomFileForMavenPublication
    inputs.property('requireKnownBuildHash', requireKnownBuildHash)

    doLast {
        if (requireKnownBuildHash) {
            validateKnownBuildHash()
        }

        File artifact = tasks.jar.archiveFile.get().asFile
        String expectedArtifactName = "${project.name}-${project.version}.jar"
        if (artifact.name != expectedArtifactName) {
            throw new GradleException("Unexpected JAR name: ${artifact.name}; expected ${expectedArtifactName}.")
        }

        def publication = publishing.publications.getByName('maven')
        if (publication.groupId != project.group.toString()
                || publication.artifactId != project.name
                || publication.version != project.version.toString()) {
            throw new GradleException('Maven publication coordinates do not match the project identity.')
        }

        File pomFile = tasks.generatePomFileForMavenPublication.destination
        def pom = new XmlSlurper().parse(pomFile)
        if (pom.groupId.text() != publication.groupId
                || pom.artifactId.text() != publication.artifactId
                || pom.version.text() != publication.version) {
            throw new GradleException('Generated Maven POM coordinates do not match the publication identity.')
        }

        JarFile jarFile = new JarFile(artifact)
        try {
            def readEntry = { String entryName ->
                def entry = jarFile.getJarEntry(entryName)
                if (entry == null) {
                    throw new GradleException("JAR is missing required entry ${entryName}.")
                }
                jarFile.getInputStream(entry).withCloseable { input ->
                    return input.getText('UTF-8')
                }
            }
            def loadProperties = { String text ->
                Properties properties = new Properties()
                new StringReader(text).withCloseable { reader ->
                    properties.load(reader)
                }
                return properties
            }

            String versionText = readEntry('net/sf/hajdbc/Version.properties')
            String buildInfoText = readEntry('net/sf/hajdbc/BuildInfo.properties')
            Properties versionProperties = loadProperties(versionText)
            Properties buildInfo = loadProperties(buildInfoText)
            if (versionProperties.stringPropertyNames() != ['version'] as Set
                    || versionProperties.getProperty('version') != buildMetadata.version) {
                throw new GradleException('Version.properties does not match the project version.')
            }

            def expectedBuildInfo = [
                    capabilityVersion     : buildMetadata.capabilityVersion,
                    buildVersion          : buildMetadata.version,
                    buildHash             : buildMetadata.buildHash,
                    supportedFeatures     : buildMetadata.supportedFeatures,
                    candidateAliasProfiles: buildMetadata.candidateAliasProfiles
            ]
            if (buildInfo.stringPropertyNames() != expectedBuildInfo.keySet()) {
                throw new GradleException('BuildInfo.properties contains an unexpected field set.')
            }
            expectedBuildInfo.each { propertyName, expectedValue ->
                if (buildInfo.getProperty(propertyName) != expectedValue) {
                    throw new GradleException("BuildInfo property ${propertyName} does not match the build identity.")
                }
            }

            def manifestAttributes = jarFile.manifest.mainAttributes
            def expectedManifest = [
                    'Implementation-Version'             : buildMetadata.version,
                    'HA-JDBC-Capability-Version'         : buildMetadata.capabilityVersion,
                    'HA-JDBC-Build-Hash'                 : buildMetadata.buildHash,
                    'HA-JDBC-Features'                   : buildMetadata.supportedFeatures,
                    'HA-JDBC-Candidate-Alias-Profiles'   : buildMetadata.candidateAliasProfiles
            ]
            expectedManifest.each { attributeName, expectedValue ->
                if (manifestAttributes.getValue(attributeName) != expectedValue) {
                    throw new GradleException("Manifest attribute ${attributeName} does not match the build identity.")
                }
            }
            ['HA-JDBC-Trust-Store-Digest', 'HA-JDBC-Certified-Alias-Profiles'].each { forbiddenAttribute ->
                if (manifestAttributes.getValue(forbiddenAttribute) != null) {
                    throw new GradleException("Manifest must not declare ${forbiddenAttribute} in PR-0B.")
                }
            }

            String manifestText = manifestAttributes.collect { key, value -> "${key}:${value}" }.join('\n')
            [versionText, buildInfoText, manifestText].each { identityText ->
                if (identityText =~ /@[A-Za-z0-9_.-]+@/) {
                    throw new GradleException('Build identity contains an unresolved replacement token.')
                }
            }

            int classCount = 0
            jarFile.entries().each { entry ->
                if (!entry.directory && entry.name.endsWith('.class')) {
                    classCount++
                    jarFile.getInputStream(entry).withCloseable { input ->
                        DataInputStream data = new DataInputStream(input)
                        if (data.readInt() != -889275714) {
                            throw new GradleException("Invalid class header for ${entry.name}.")
                        }
                        data.readUnsignedShort()
                        int majorVersion = data.readUnsignedShort()
                        if (majorVersion != 52) {
                            throw new GradleException("${entry.name} has class major ${majorVersion}; expected 52.")
                        }
                    }
                }
            }
            if (classCount == 0) {
                throw new GradleException('JAR contains no Java classes to verify.')
            }
        }
        finally {
            jarFile.close()
        }
    }
}

check.dependsOn verifyBuildMetadata
